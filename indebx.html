<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTBI Kecamatan Arut Selatan 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--g:#1f4d3a;--g2:#2d6a4f;--o:#c8841f;--bg:#f6f1e7;--c:#fffdf8;--t:#26302b;--l:#d9d0bc}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--t)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:.2em 0}
header{background:var(--g);color:#fff;padding:18px 20px 0;border-bottom:5px solid var(--o)}
header h1{font-size:1.45rem;font-weight:800}header small{opacity:.8}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
nav button{background:none;border:0;color:#d7e6dc;padding:10px 16px;cursor:pointer;font:600 14px 'Public Sans';border-radius:8px 8px 0 0}
nav button.on{background:var(--bg);color:var(--g)}
main{max-width:1100px;margin:auto;padding:20px}
.card{background:var(--c);border:1px solid var(--l);border-radius:10px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--l);border-radius:7px;font:inherit;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 16px}
.btn{background:var(--g2);color:#fff;border:0;padding:9px 16px;border-radius:7px;cursor:pointer;font:600 14px 'Public Sans'}
.btn.o{background:var(--o)}.btn.s{background:#fff;color:var(--g);border:1px solid var(--g)}.btn.sm{padding:4px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--l);padding:6px 8px;text-align:left}th{background:#ece4d0}
.wrap{overflow-x:auto}.hide{display:none}.msg{padding:10px;border-radius:7px;background:#e6f2ea;margin:10px 0}.err{background:#f9e3df}
.medal{font-weight:800;color:var(--o)}
td input.sc{width:70px;padding:4px}
iframe{width:100%;height:560px;border:1px solid var(--l);border-radius:8px}
#pa{display:none}
@media print{body{background:#fff}header,main,.noprint{display:none!important}#pa{display:block;padding:10mm;color:#000}
#pa table{font-size:12px}#pa th{background:#eee!important}.pg{page-break-after:always}}
.sp{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
button:disabled{opacity:.7;cursor:wait}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:#26302b;color:#fff;padding:10px 18px;border-radius:24px;box-shadow:0 4px 14px #0004;opacity:0;pointer-events:none;transition:.2s;z-index:99;font-size:14px;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.ok{background:var(--g2)}#toast.err{background:#a63d2f}
@media print{#toast{display:none!important}}
</style>
</head>
<body>
<header>
  <h1>Festival Tunas Bahasa Ibu 2026</h1>
  <small>Tingkat Kecamatan Arut Selatan · Bahasa Melayu Dialek Kotawaringin</small>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="pa"></div>
<div class="noprint" style="text-align:center;font-size:12px;opacity:.55;padding:0 0 14px">Versi 3 · 6 Okt 2026</div>
<div id="toast"></div>

<script>
/* ===== KONFIGURASI ===== */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbwsCt3lYQ-wlok1kyUpfeLcJ5EwsdzejRsn7_BW2K7WTXCdowfamlOGhiCjfgKwxY4V/exec",          // isi URL Web App Google Apps Script (lihat Code.gs). Kosong = mode demo (data di browser ini saja)
  ADMIN_PW: "admin123", // password admin (mode demo). Pada mode API, password dicek di Code.gs
  EVENT: "Senin, 26 Oktober 2026 · SDN 3 Pasir Panjang"
};
const CAB = {
  MDG:{n:"Mendongeng",i:[["Alur dan keruntutan cerita",10],["Suara (intonasi, artikulasi, tempo, volume)",30],["Penampilan (gestur, ekspresi, mimik)",30],["Improvisasi/kreativitas",10],["Kesesuaian dengan tema",20]]},
  PDT:{n:"Berpidato",i:[["Kesesuaian isi dengan tema",20],["Suara (intonasi, artikulasi, tempo, volume)",30],["Penampilan (ekspresi, gestur, kostum)",30],["Bahasa",15],["Improvisasi (kostum, sikap)",5]]},
  PUI:{n:"Cipta Puisi",i:[["Kesesuaian isi dengan tema",20],["Orisinalitas",30],["Kepaduan (struktur, teknik, proporsi ide)",30],["Bahasa",10],["Makna dan pesan",10]]},
  CRP:{n:"Menulis Cerita Pendek",i:[["Kesesuaian isi dengan tema",20],["Orisinalitas",20],["Kreativitas (proporsi ide, diksi)",30],["Kepaduan (struktur, alur)",20],["Kerapihan format",10]]},
  KMD:{n:"Komedi Tunggal",i:[["Orisinalitas materi",20],["Relevansi dengan tema",20],["Vokal (intonasi, artikulasi)",20],["Ekspresi (wajah, tubuh)",10],["Kreativitas (ritme, interaksi audiens)",30]]},
  PNT:{n:"Pantun Seloka",i:[["Kesesuaian dengan tema",20],["Kaidah seloka (isi, pesan, pola, rima)",20],["Kebahasaan",20],["Penampilan (suara, intonasi, artikulasi)",30],["Improvisasi/kreativitas",10]]}
};
/* ===== DATA ===== */
let S={peserta:[],nilai:{},info:{teks:"Selamat datang di pendaftaran FTBI Tingkat Kecamatan Arut Selatan 2026.\nPeserta tiap cabang adalah juara 1 dan 2 dari masing-masing gugus.",pdfs:[]},publish:false};
let pw="",isAdmin=false,view="home",atab="data";
const $=s=>document.querySelector(s), e=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=!!CONFIG.API_URL;
let busyN=0,tt;
function toast(m,k){const t=$("#toast");clearTimeout(tt);t.className="show "+(k||"");t.innerHTML=(k?"":'<i class="sp"></i>')+e(m);if(k)tt=setTimeout(()=>t.className="",k=="err"?3500:1600)}
function busyStart(m){busyN++;toast(m)}
function busyEnd(ok,err){busyN=Math.max(0,busyN-1);if(err)toast(err,"err");else if(!busyN){ok?toast(ok,"ok"):$("#toast").className=""}}
async function run(btn,label,fn){           // nonaktifkan tombol + tampilkan spinner selama proses
  if(btn){if(btn.disabled)return;btn._h=btn.innerHTML;btn.disabled=true;btn.innerHTML='<i class="sp"></i>'+label}
  try{return await fn()}finally{if(btn&&btn.isConnected){btn.disabled=false;btn.innerHTML=btn._h}}
}
const WAIT=m=>`<div class="msg"><i class="sp"></i>${m}</div>`;
const CK="ftbi_cache";
async function load(msg){busyStart(msg||"Memuat data…");try{await load_()}finally{busyEnd()}}
async function load_(){
  try{
    if(api){S=Object.assign(S,await (await fetch(CONFIG.API_URL)).json());try{localStorage.setItem(CK,JSON.stringify(S))}catch(x){}}
    else{const d=localStorage.getItem("ftbi");if(d)S=JSON.parse(d)}
  }catch(x){console.error(x)}
}
const MSG={add:"Mengirim pendaftaran…",update:"Menyimpan perubahan…",delete:"Menghapus data…",save:"Menyimpan data…"};
async function post(action,payload){
  busyStart(MSG[action]||"Memproses…");
  try{await post_(action,payload);busyEnd("✔ Berhasil")}catch(x){busyEnd(null,x.message=="Failed to fetch"?"Gagal terhubung ke server":x.message);throw x}
}
async function post_(action,payload){
  if(api){
    const r=await (await fetch(CONFIG.API_URL,{method:"POST",body:JSON.stringify({action,pw,...payload})})).json();
    if(r.error)throw new Error(r.error);S=Object.assign(S,r);try{localStorage.setItem(CK,JSON.stringify(S))}catch(x){}return;
  }
  if(action=="add")S.peserta.push(payload.data);
  else if(action=="update")S.peserta=S.peserta.map(p=>p.id==payload.id?{...p,...payload.data}:p);
  else if(action=="delete"){S.peserta=S.peserta.filter(p=>p.id!=payload.id);delete S.nilai[payload.id]}
  else Object.assign(S,payload); 
  try{localStorage.setItem("ftbi",JSON.stringify(S))}catch(x){}
}
/* ===== UTIL ===== */
const total=(c,id)=>{const n=S.nilai[id]||{};return CAB[c].i.reduce((a,[,w],k)=>a+((+n[k]||0)*w/100),0)};
const scored=(c,id)=>S.nilai[id]&&Object.keys(S.nilai[id]).length>0;
function ranking(c){
  const l=S.peserta.filter(p=>p.cabang==c&&scored(c,p.id)).map(p=>({...p,tot:total(c,p.id)})).sort((a,b)=>b.tot-a.tot);
  l.forEach((p,i)=>p.rank=i&&l[i-1].tot==p.tot?l[i-1].rank:i+1);return l;
}
const tgl=d=>d?new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}):"";
function printHTML(h){$("#pa").innerHTML=h;window.print()}
const kop=t=>`<div style="text-align:center;border-bottom:3px double #000;padding-bottom:6px;margin-bottom:12px"><b>FESTIVAL TUNAS BAHASA IBU (FTBI) 2026</b><br>Tingkat Kecamatan Arut Selatan<br>${CONFIG.EVENT}<h3 style="margin:8px 0 0">${t}</h3></div>`;
function bukti(id){
  const p=S.peserta.find(x=>x.id==id);if(!p)return;
  printHTML(kop("BUKTI PENDAFTARAN")+`<table style="width:100%">
  ${[["No. Peserta",p.id],["Cabang Lomba",CAB[p.cabang].n],["Nama Siswa",p.nama],["Tempat, Tgl Lahir",p.tempat+", "+tgl(p.tgl)],["NISN",p.nisn],["Kelas",p.kelas],["Asal Sekolah",p.sekolah],["Asal Gugus",p.gugus],["Guru Pendamping",p.guru],["Waktu Daftar",new Date(p.ts).toLocaleString("id-ID")]].map(r=>`<tr><th style="width:35%">${r[0]}</th><td>${e(r[1])}</td></tr>`).join("")}</table>
  <p style="margin-top:14px">Harap membawa bukti ini saat registrasi ulang pada hari pelaksanaan (pukul 07.30–08.00).</p>
  <div style="float:right;text-align:center;margin-top:20px">Panitia,<br><br><br><br>(................................)</div>`);
}
/* ===== NAV ===== */
const MENU=[["home","Beranda"],["daftar","Pendaftaran"],["peserta","Daftar Peserta"],["cek","Cek Nilai"],["admin","Admin"]];
function nav(){$("#nav").innerHTML=MENU.map(([k,v])=>`<button class="${view==k?"on":""}" onclick="go('${k}')">${v}</button>`).join("")}
function go(v){view=v;nav();render()}
function render(){({home,daftar,peserta,cek,admin})[view]()}
/* ===== BERANDA ===== */
function home(){
  const pdfs=S.info.pdfs||[];
  $("#app").innerHTML=`<div class="card"><h2>Informasi</h2><div style="white-space:pre-wrap">${e(S.info.teks)}</div>
  <p><b>Pelaksanaan:</b> ${CONFIG.EVENT}</p></div>
  <div class="card"><h3>Cabang Lomba</h3><ul>${Object.values(CAB).map(c=>`<li>${c.n}</li>`).join("")}</ul></div>
  ${pdfs.map(p=>`<div class="card"><h3>${e(p.judul)}</h3><iframe loading="lazy" src="https://drive.google.com/file/d/${e(p.id)}/preview" allow="autoplay"></iframe><p style="font-size:13px"><a href="https://drive.google.com/file/d/${e(p.id)}/view" target="_blank" rel="noopener">Buka di tab baru</a></p></div>`).join("")}`;
}
/* ===== PENDAFTARAN ===== */
const F=(p={})=>`<div class="grid">
  <div><label>Nama Siswa</label><input name="nama" required value="${e(p.nama)}"></div>
  <div><label>NISN (10 digit)</label><input name="nisn" required pattern="\\d{10}" inputmode="numeric" maxlength="10" value="${e(p.nisn)}"></div>
  <div><label>Tempat Lahir</label><input name="tempat" required value="${e(p.tempat)}"></div>
  <div><label>Tanggal Lahir</label><input type="date" name="tgl" required value="${e(p.tgl)}"></div>
  <div><label>Kelas</label><select name="kelas">${[1,2,3,4,5,6].map(k=>`<option ${p.kelas==k?"selected":""}>${k}</option>`).join("")}</select></div>
  <div><label>Asal Sekolah</label><input name="sekolah" required value="${e(p.sekolah)}"></div>
  <div><label>Asal Gugus</label><input name="gugus" required value="${e(p.gugus)}"></div>
  <div><label>Guru Pendamping</label><input name="guru" required value="${e(p.guru)}"></div></div>`;
function daftar(){
  $("#app").innerHTML=`<div class="card"><h2>Form Pendaftaran</h2><form id="f" onsubmit="return false">
  <label>Cabang Lomba</label><select name="cabang" required>${Object.entries(CAB).map(([k,c])=>`<option value="${k}">${c.n}</option>`).join("")}</select>
  ${F()}
  <div class="row"><button class="btn" id="sb">Daftar</button></div><div id="res"></div></form></div>`;
  $("#sb").onclick=()=>{
    const f=$("#f");if(!f.reportValidity())return;
    const d=Object.fromEntries(new FormData(f));
    run($("#sb"),"Memproses…",async()=>{
      $("#res").innerHTML=WAIT("Sedang memproses pendaftaran, mohon tunggu dan jangan tutup halaman…");
      if(!api){                                  // mode demo: cek & nomor dibuat di browser
        if(S.peserta.some(p=>p.nisn==d.nisn&&p.cabang==d.cabang)){$("#res").innerHTML=`<div class="msg err">NISN ini sudah terdaftar pada cabang tersebut.</div>`;return}
        const n=Math.max(0,...S.peserta.filter(p=>p.cabang==d.cabang).map(p=>+String(p.id).split("-")[1]||0))+1;
        d.id=d.cabang+"-"+String(n).padStart(3,"0");d.ts=new Date().toISOString();
      }
      try{await post("add",{data:d})}catch(x){$("#res").innerHTML=`<div class="msg err">Gagal: ${e(x.message)}</div>`;return}
      const real=S.peserta.find(p=>p.nisn==d.nisn&&p.cabang==d.cabang)||d;
      $("#res").innerHTML=`<div class="msg">✔ Pendaftaran berhasil. No. peserta: <b>${real.id}</b> <button type="button" class="btn o sm" onclick="bukti('${real.id}')">Cetak Bukti</button></div>`;
      f.reset();
    });
  };
}
/* ===== PESERTA ===== */
function peserta(){
  $("#app").innerHTML=`<div class="card"><h2>Daftar Peserta</h2><div class="row"><select id="fc" style="max-width:260px"><option value="">Semua cabang</option>${Object.entries(CAB).map(([k,c])=>`<option value="${k}">${c.n}</option>`).join("")}</select>
  <button class="btn s" onclick="xl()">Unduh Excel</button></div><div class="wrap" id="tb"></div></div>`;
  $("#fc").onchange=ptab;ptab();
}
const flt=()=>S.peserta.filter(p=>!$("#fc").value||p.cabang==$("#fc").value);
function ptab(){
  const l=flt();
  $("#tb").innerHTML=l.length?`<table><tr><th>No</th><th>No. Peserta</th><th>Nama</th><th>Cabang</th><th>NISN</th><th>Kelas</th><th>Sekolah</th><th>Gugus</th><th>Pendamping</th><th></th></tr>
  ${l.map((p,i)=>`<tr><td>${i+1}</td><td>${p.id}</td><td>${e(p.nama)}</td><td>${CAB[p.cabang].n}</td><td>${e(p.nisn)}</td><td>${e(p.kelas)}</td><td>${e(p.sekolah)}</td><td>${e(p.gugus)}</td><td>${e(p.guru)}</td><td><button class="btn sm o" onclick="bukti('${p.id}')">Cetak</button></td></tr>`).join("")}</table>`:"<p>Belum ada peserta.</p>";
}
function xl(){
  const rows=flt().map((p,i)=>({No:i+1,"No. Peserta":p.id,"Cabang":CAB[p.cabang].n,"Nama Siswa":p.nama,"Tempat Lahir":p.tempat,"Tanggal Lahir":p.tgl,NISN:p.nisn,Kelas:p.kelas,"Asal Sekolah":p.sekolah,"Asal Gugus":p.gugus,"Guru Pendamping":p.guru}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Peserta");XLSX.writeFile(wb,"peserta_FTBI_2026.xlsx");
}
/* ===== CEK NILAI ===== */
function cek(){
  $("#app").innerHTML=`<div class="card"><h2>Cek Nilai</h2><div class="row"><input id="cn" placeholder="Masukkan NISN" style="max-width:260px" inputmode="numeric"><button class="btn" onclick="cari(this)">Cek</button></div><div id="cr"></div></div>`;
}
function cari(btn){return run(btn,"Mencari…",async()=>{$("#cr").innerHTML=WAIT("Sedang mencari data, mohon tunggu…");await cari_()})}
async function cari_(){
  await load("Mengambil nilai…");const q=$("#cn").value.trim();
  if(!S.publish){$("#cr").innerHTML=`<div class="msg err">Nilai belum dipublikasikan oleh panitia.</div>`;return}
  const l=S.peserta.filter(p=>p.nisn==q);
  if(!l.length){$("#cr").innerHTML=`<div class="msg err">NISN tidak ditemukan.</div>`;return}
  $("#cr").innerHTML=l.map(p=>{
    const c=CAB[p.cabang];
    if(!scored(p.cabang,p.id))return `<h3>${e(p.nama)} – ${c.n}</h3><p>Nilai belum tersedia.</p>`;
    const r=ranking(p.cabang),me=r.find(x=>x.id==p.id);
    return `<h3>${e(p.nama)} – ${c.n}</h3><div class="wrap"><table><tr><th>Indikator</th><th>Bobot</th><th>Nilai</th><th>Skor</th></tr>
    ${c.i.map(([n,w],k)=>{const v=+(S.nilai[p.id][k]||0);return `<tr><td>${n}</td><td>${w}%</td><td>${v}</td><td>${(v*w/100).toFixed(2)}</td></tr>`}).join("")}
    <tr><th colspan="3">Total</th><th>${me.tot.toFixed(2)}</th></tr></table></div>
    <p class="medal">Peringkat ${me.rank} dari ${r.length} peserta</p>`}).join("");
}
/* ===== ADMIN ===== */
function admin(){
  if(!isAdmin){
    $("#app").innerHTML=`<div class="card" style="max-width:360px"><h2>Login Admin</h2><label>Password</label><input type="password" id="pw" onkeydown="if(event.key=='Enter')login($('#lb'))"><div class="row"><button class="btn" id="lb" onclick="login(this)">Masuk</button></div><div id="le"></div></div>`;return;
  }
  const T=[["data","Data Peserta"],["hadir","Daftar Hadir"],["form","Form Penilaian"],["nilai","Input Nilai"],["rekap","Rekap Nilai"],["juara","Juara"],["info","Info Beranda"]];
  $("#app").innerHTML=`<div class="row">${T.map(([k,v])=>`<button class="btn ${atab==k?"":"s"}" onclick="atab='${k}';admin()">${v}</button>`).join("")}<button class="btn s" style="margin-left:auto" onclick="isAdmin=false;pw='';admin()">Keluar</button></div><div class="card" id="at"></div>`;
  ({data:tData,hadir:tHadir,form:tForm,nilai:tNilai,rekap:tRekap,juara:tJuara,info:tInfo})[atab]();
}
function login(btn){
  const v=$("#pw").value;
  return run(btn,"Memeriksa…",async()=>{
    $("#le").innerHTML=WAIT("Sedang memeriksa password, mohon tunggu…");busyStart("Memeriksa password…");
    try{
      if(api){
        const r=await (await fetch(CONFIG.API_URL,{method:"POST",body:JSON.stringify({action:"auth",pw:v})})).json();
        if(r.error)throw new Error("PW");
        S=Object.assign(S,r);try{localStorage.setItem(CK,JSON.stringify(S))}catch(x){}
      }else if(v!=CONFIG.ADMIN_PW)throw new Error("PW");
      pw=v;isAdmin=true;busyEnd("✔ Berhasil masuk");admin();
    }catch(x){
      busyEnd();
      $("#le").innerHTML=`<div class="msg err">${x.message=="PW"?"Password salah.":"Gagal terhubung ke server. Periksa koneksi lalu coba lagi."}</div>`;
    }
  });
}
const cabSel=()=>`<select id="ac" style="max-width:260px">${Object.entries(CAB).map(([k,c])=>`<option value="${k}">${c.n}</option>`).join("")}</select>`;
const pl=c=>S.peserta.filter(p=>p.cabang==c);
function tData(){
  $("#at").innerHTML=`<h3>Data Peserta</h3><div class="row"><select id="dc" style="max-width:260px"><option value="">Semua cabang</option>${Object.entries(CAB).map(([k,c])=>`<option value="${k}">${c.n}</option>`).join("")}</select>
  <button class="btn s" onclick="run(this,'Memuat…',()=>load('Memuat ulang data…').then(dTab))">Muat ulang</button></div><div id="ed"></div><div class="wrap" id="dt"></div>`;
  $("#dc").onchange=dTab;dTab();
}
function dTab(){
  const v=$("#dc").value,l=S.peserta.filter(p=>!v||p.cabang==v);
  $("#dt").innerHTML=l.length?`<table><tr><th>No</th><th>No. Peserta</th><th>Nama</th><th>Cabang</th><th>NISN</th><th>Kelas</th><th>Sekolah</th><th>Gugus</th><th>Pendamping</th><th>Aksi</th></tr>
  ${l.map((p,i)=>`<tr><td>${i+1}</td><td>${p.id}</td><td>${e(p.nama)}</td><td>${CAB[p.cabang]?.n||p.cabang}</td><td>${e(p.nisn)}</td><td>${e(p.kelas)}</td><td>${e(p.sekolah)}</td><td>${e(p.gugus)}</td><td>${e(p.guru)}</td>
  <td style="white-space:nowrap"><button class="btn sm" onclick="editP('${p.id}')">Edit</button> <button class="btn sm" style="background:#a63d2f" onclick="delP('${p.id}',this)">Hapus</button></td></tr>`).join("")}</table>`:"<p>Belum ada peserta.</p>";
}
function editP(id){
  const p=S.peserta.find(x=>x.id==id);if(!p)return;
  $("#ed").innerHTML=`<div class="card" style="border-color:var(--o)"><h3>Edit Peserta ${p.id}</h3><form id="ef" onsubmit="return false">${F(p)}
  <p style="font-size:13px">Cabang: <b>${CAB[p.cabang].n}</b>. Untuk memindahkan cabang, hapus lalu daftarkan ulang.</p>
  <div class="row"><button class="btn" onclick="saveP('${id}',this)">Simpan Perubahan</button><button class="btn s" onclick="$('#ed').innerHTML=''">Batal</button><span id="es"></span></div></form></div>`;
  $("#ed").scrollIntoView({behavior:"smooth"});
}
function saveP(id,btn){return run(btn,"Menyimpan…",async()=>{$("#es").innerHTML=' ⏳ Sedang menyimpan…';await saveP_(id)})}
async function saveP_(id){
  const f=$("#ef");if(!f.reportValidity())return;
  const d=Object.fromEntries(new FormData(f)),p=S.peserta.find(x=>x.id==id);
  if(S.peserta.some(x=>x.id!=id&&x.nisn==d.nisn&&x.cabang==p.cabang)){$("#es").innerHTML=" NISN sudah dipakai peserta lain di cabang ini.";return}
  try{await post("update",{id,data:d});$("#ed").innerHTML="";dTab()}catch(x){$("#es").innerHTML=" Gagal: "+e(x.message)}
}
function delP(id,btn){return run(btn,"Menghapus…",()=>delP_(id))}
async function delP_(id){
  const p=S.peserta.find(x=>x.id==id);
  if(!confirm(`Hapus peserta ${p.id} - ${p.nama}?\nNilai peserta ini juga ikut terhapus.`))return;
  try{await post("delete",{id});dTab()}catch(x){alert("Gagal: "+x.message)}
}
function tHadir(){
  $("#at").innerHTML=`<h3>Daftar Hadir</h3><div class="row">${cabSel()}<button class="btn o" onclick="pHadir()">Cetak</button></div>`;
}
function pHadir(){
  const c=$("#ac").value;
  printHTML(kop("DAFTAR HADIR PESERTA<br>Lomba "+CAB[c].n)+`<table><tr><th>No</th><th>No. Peserta</th><th>Nama</th><th>Asal Sekolah</th><th>Gugus</th><th style="width:25%">Tanda Tangan</th></tr>
  ${pl(c).map((p,i)=>`<tr style="height:34px"><td>${i+1}</td><td>${p.id}</td><td>${e(p.nama)}</td><td>${e(p.sekolah)}</td><td>${e(p.gugus)}</td><td></td></tr>`).join("")}</table>`);
}
function tForm(){
  $("#at").innerHTML=`<h3>Form Penilaian</h3><div class="row">${cabSel()}<button class="btn o" onclick="pForm()">Cetak</button></div>`;
}
function pForm(){
  const c=$("#ac").value,C=CAB[c];
  printHTML(kop("FORMULIR PENILAIAN<br>Lomba "+C.n)+`<p>Nama Juri: ................................. &nbsp; Skala nilai tiap indikator: 0–100</p>
  <table><tr><th>No</th><th>No. Peserta</th><th>Nama</th>${C.i.map(([n,w])=>`<th>${n}<br>(${w}%)</th>`).join("")}<th>Total</th></tr>
  ${pl(c).map((p,i)=>`<tr style="height:34px"><td>${i+1}</td><td>${p.id}</td><td>${e(p.nama)}</td>${C.i.map(()=>"<td></td>").join("")}<td></td></tr>`).join("")}</table>
  <div style="float:right;text-align:center;margin-top:24px">Juri,<br><br><br>(................................)</div>`);
}
function tNilai(){
  $("#at").innerHTML=`<h3>Input Nilai</h3><div class="row">${cabSel()}<label style="margin:0;font-weight:400"><input type="checkbox" id="pub" style="width:auto" ${S.publish?"checked":""}> Publikasikan nilai di Cek Nilai</label></div><div id="nt"></div>`;
  $("#ac").onchange=nTab;$("#pub").onchange=async()=>{const c=$("#pub");c.disabled=true;try{await post("save",{publish:c.checked})}catch(x){c.checked=!c.checked}finally{c.disabled=false}};nTab();
}
function nTab(){
  const c=$("#ac").value,C=CAB[c],l=pl(c);
  $("#nt").innerHTML=l.length?`<div class="wrap"><table><tr><th>No. Peserta</th><th>Nama</th>${C.i.map(([n,w])=>`<th>${n} (${w}%)</th>`).join("")}<th>Total</th></tr>
  ${l.map(p=>`<tr data-id="${p.id}"><td>${p.id}</td><td>${e(p.nama)}</td>${C.i.map((_,k)=>`<td><input class="sc" type="number" min="0" max="100" step="0.1" data-k="${k}" value="${S.nilai[p.id]?.[k]??""}" oninput="hit(this)"></td>`).join("")}<td class="tt"><b>${scored(c,p.id)?total(c,p.id).toFixed(2):"-"}</b></td></tr>`).join("")}</table></div>
  <div class="row"><button class="btn" onclick="simpanNilai(this)">Simpan Nilai</button><span id="ns"></span></div>`:"<p>Belum ada peserta pada cabang ini.</p>";
}
function hit(el){
  const tr=el.closest("tr"),C=CAB[$("#ac").value];
  const t=[...tr.querySelectorAll(".sc")].reduce((a,i,k)=>a+(+i.value||0)*C.i[k][1]/100,0);tr.querySelector(".tt").innerHTML=`<b>${t.toFixed(2)}</b>`;
}
function simpanNilai(btn){return run(btn,"Menyimpan…",async()=>{$("#ns").innerHTML=' ⏳ Sedang menyimpan…';await simpanNilai_()})}
async function simpanNilai_(){
  const nilai={...S.nilai};
  document.querySelectorAll("#nt tr[data-id]").forEach(tr=>{
    const o={};tr.querySelectorAll(".sc").forEach(i=>{if(i.value!=="")o[i.dataset.k]=Math.min(100,Math.max(0,+i.value))});
    if(Object.keys(o).length)nilai[tr.dataset.id]=o;
  });
  try{await post("save",{nilai});$("#ns").innerHTML=" ✔ Tersimpan"}catch(x){$("#ns").innerHTML=" Gagal: "+e(x.message)}
}
function tJuara(){
  $("#at").innerHTML=`<h3>Daftar Juara</h3><div class="row"><button class="btn o" onclick="pJuara()">Cetak</button></div><div id="jr">${juaraHTML()}</div>`;
}
function juaraHTML(){
  return Object.entries(CAB).map(([k,C])=>{
    const r=ranking(k).filter(p=>p.rank<=3);
    return `<h4>${C.n}</h4>`+(r.length?`<table><tr><th>Juara</th><th>No</th><th>Nama</th><th>Sekolah</th><th>Gugus</th><th>Nilai</th></tr>${r.map(p=>`<tr><td class="medal">${p.rank}</td><td>${p.id}</td><td>${e(p.nama)}</td><td>${e(p.sekolah)}</td><td>${e(p.gugus)}</td><td>${p.tot.toFixed(2)}</td></tr>`).join("")}</table>`:"<p>Belum ada nilai.</p>");
  }).join("");
}
function pJuara(){printHTML(kop("DAFTAR JUARA")+juaraHTML())}
function tInfo(){
  $("#at").innerHTML=`<h3>Info Beranda</h3><label>Teks informasi</label><textarea id="it" rows="6">${e(S.info.teks)}</textarea>
  <label>PDF dari Google Drive (satu per baris: <code>Judul | link berbagi</code>)</label>
  <textarea id="ip" rows="4" placeholder="Pedoman Umum | https://drive.google.com/file/d/XXXX/view">${(S.info.pdfs||[]).map(p=>p.judul+" | https://drive.google.com/file/d/"+p.id+"/view").join("\n")}</textarea>
  <p style="font-size:13px">File di Drive harus dibagikan "Siapa saja yang memiliki link".</p>
  <div class="row"><button class="btn" onclick="simpanInfo(this)">Simpan</button><span id="is"></span></div>`;
}
const driveId=v=>{v=String(v||"").trim();const m=v.match(/\/d\/([-\w]{10,})/)||v.match(/[?&]id=([-\w]{10,})/)||v.match(/^([-\w]{20,})$/);return m?m[1]:""};
function simpanInfo(btn){return run(btn,"Menyimpan…",simpanInfo_)}
async function simpanInfo_(){
  const pdfs=[],bad=[];
  $("#ip").value.split("\n").map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{
    const k=l.indexOf("|"),id=k<0?"":driveId(l.slice(k+1));
    if(!id)bad.push(i+1);else pdfs.push({judul:l.slice(0,k).trim()||"Dokumen "+(pdfs.length+1),id});
  });
  if(bad.length){$("#is").innerHTML=" Gagal: baris "+bad.join(", ")+" tidak valid (format: Judul | link berbagi)";return}
  $("#is").innerHTML=" ⏳ Sedang menyimpan…";
  try{
    await post("save",{info:{teks:$("#it").value,pdfs}});
    if(api&&(S.info.pdfs||[]).length!=pdfs.length)throw new Error("PDF tidak tersimpan di Sheet. Pastikan Code.gs versi terbaru sudah di-deploy (New version).");
    $("#is").innerHTML=" ✔ Tersimpan";
  }catch(x){$("#is").innerHTML=" Gagal: "+e(x.message)}
}
/* ===== REKAP NILAI ===== */
function rekapData(c){
  const C=CAB[c],r=ranking(c),un=pl(c).filter(p=>!scored(c,p.id));
  const val=(p,k)=>S.nilai[p.id]?.[k]!==undefined?+S.nilai[p.id][k]:"";
  return {C,r,un,val};
}
function rekapTbl(c){
  const {C,r,un,val}=rekapData(c),n=pl(c).length;
  const row=(p,rk)=>`<tr><td class="${rk!="-"&&rk<=3?"medal":""}">${rk}</td><td>${p.id}</td><td>${e(p.nama)}</td><td>${e(p.sekolah)}</td><td>${e(p.gugus)}</td>${C.i.map((_,k)=>`<td>${val(p,k)===""?"-":val(p,k)}</td>`).join("")}<td><b>${rk=="-"?"-":p.tot.toFixed(2)}</b></td></tr>`;
  const st=r.length?` · Tertinggi: ${r[0].tot.toFixed(2)} · Terendah: ${r[r.length-1].tot.toFixed(2)} · Rata-rata: ${(r.reduce((a,p)=>a+p.tot,0)/r.length).toFixed(2)}`:"";
  return `<h4>${C.n}</h4><p style="font-size:13px;margin:2px 0 6px">Peserta: ${n} · Sudah dinilai: ${r.length} · Belum dinilai: ${un.length}${st}</p>`+(n?`<div class="wrap"><table><tr><th>Peringkat</th><th>No. Peserta</th><th>Nama</th><th>Sekolah</th><th>Gugus</th>${C.i.map(([t,w])=>`<th>${t}<br>(${w}%)</th>`).join("")}<th>Total</th></tr>${r.map(p=>row(p,p.rank)).join("")}${un.map(p=>row(p,"-")).join("")}</table></div>`:"<p>Belum ada peserta.</p>");
}
const rkList=()=>$("#rc").value?[$("#rc").value]:Object.keys(CAB);
function drawRekap(){$("#rk").innerHTML=rkList().map(rekapTbl).join("")}
function tRekap(){
  $("#at").innerHTML=`<h3>Rekap Nilai</h3><div class="row"><select id="rc" style="max-width:260px"><option value="">Semua cabang</option>${Object.entries(CAB).map(([k,c])=>`<option value="${k}">${c.n}</option>`).join("")}</select>
  <button class="btn o" onclick="pRekap()">Cetak</button><button class="btn s" onclick="xRekap()">Unduh Excel</button>
  <button class="btn s" onclick="run(this,'Memuat…',()=>load('Memuat ulang data…').then(drawRekap))">Muat ulang</button></div>
  <p style="font-size:13px">Nilai indikator skala 0–100; Total = jumlah (nilai × bobot). Peringkat hanya untuk peserta yang sudah dinilai.</p><div id="rk"></div>`;
  $("#rc").onchange=drawRekap;drawRekap();
}
function pRekap(){
  const l=rkList();
  printHTML(kop("REKAP NILAI"+(l.length==1?"<br>Lomba "+CAB[l[0]].n:""))+l.map((c,i)=>`<div ${i<l.length-1?'class="pg"':""}>${rekapTbl(c)}</div>`).join(""));
}
function xRekap(){
  const wb=XLSX.utils.book_new();
  rkList().forEach(c=>{
    const {C,r,un,val}=rekapData(c);
    const rows=[...r.map(p=>[p.rank,p]),...un.map(p=>["-",p])].map(([rk,p])=>{
      const o={Peringkat:rk,"No. Peserta":p.id,"Nama Siswa":p.nama,"Asal Sekolah":p.sekolah,"Asal Gugus":p.gugus};
      C.i.forEach(([n,w],k)=>o[`${n} (${w}%)`]=val(p,k));o.Total=rk=="-"?"":+p.tot.toFixed(2);return o;
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{}]),C.n.slice(0,31));
  });
  XLSX.writeFile(wb,"rekap_nilai_FTBI_2026.xlsx");
}

nav();
if(api){try{const c=JSON.parse(localStorage.getItem(CK));if(c){S=Object.assign(S,c);render()}else $("#app").innerHTML='<div class="card">Memuat data…</div>'}catch(x){}}
load("Memperbarui data…").then(()=>{if(!isAdmin||view!="admin")render()});
</script>
